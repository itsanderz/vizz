[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-sdk"
version = "0.1.0"
description = "The Sovereign Experiment Engine - Local-first ML experiment tracking"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Atlas Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyarrow>=14.0.0",
    "duckdb>=0.9.0",
    "pydantic>=2.0.0",
    "safetensors>=0.4.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
gpu = [
    "pynvml>=11.0.0",
]

[project.urls]
Homepage = "https://github.com/itsanderz/vizz"
Repository = "https://github.com/itsanderz/vizz"

[tool.hatch.build.targets.wheel]
packages = ["atlas_sdk"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
